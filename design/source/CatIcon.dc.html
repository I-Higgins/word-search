<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","options":["fishing","boats","cars","classic","animals","birds","places","sport","food","garden","weather","music","house","space","ocean","trees"],"default":"fishing"},"size":{"editor":"int","min":16,"max":512,"default":96},"color":{"editor":"color","default":"#1F3A5F"},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    var icon = this.props.icon || 'fishing';
    var keys = ['fishing','boats','cars','classic','animals','birds','places','sport','food','garden','weather','music','house','space','ocean','trees'];

    var size = parseInt(this.props.size, 10) || 96;
    var sw = size <= 32 ? 2.2 : (size <= 64 ? 1.9 : 1.7);
    return { k: k, size: size, sw: sw, color: this.props.color || '#1F3A5F' };
  }
}
</script>
