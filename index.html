<!doctype html>
<html lang="en-AU" data-theme="light" data-text="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Word Search</title>
  <meta name="description" content="A free word search game. No ads, no accounts, works offline.">
  <meta name="theme-color" content="#F6F1E7">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Word Search">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply saved theme and text size before first paint (no flash of the wrong theme).
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('wordsearch:v1') || '{}').settings || {};
        var d = document.documentElement;
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        d.dataset.theme = s.theme || (dark ? 'dark' : 'light');
        if (s.textSize) d.dataset.text = s.textSize;
      } catch (e) { /* the app shows a friendly message if saved data is unreadable */ }
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <noscript><p style="padding:24px;font-size:20px">Word Search needs JavaScript turned on.</p></noscript>
</body>
</html>
